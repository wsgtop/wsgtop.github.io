name: Deploy Nuxt to GitHub Pages
on:
  push:
    branches: ["nuxt-blog"] # 监听 nuxt-blog 分支的推送

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      # 核心：执行我们在 package.json 中配置好的多环境打包脚本
      - run: npm run generate:github

      # 将构建产物上传为 Artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️  Nuxt 4 generate 的静态产物输出在 .output/public（不是 dist！）
          #     错误地写 ./dist 会导致上传空目录 → Pages 重新 fallback 到 README
          path: ./.output/public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
